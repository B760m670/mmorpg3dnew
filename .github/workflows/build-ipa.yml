name: Build IPA

on:
  push:
    branches:
      - main
      - claude/romanov-game-dev-uurxhs
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_TPL_DIR: "4.3.stable"

jobs:
  build:
    name: Godot 4 -> unsigned IPA (for LiveContainer)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot + export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TPL_DIR}"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TPL_DIR}/"

      - name: Import project (headless)
        run: |
          "$GODOT" --headless --path game --import 2>&1 | tail -40 || true

      - name: Export Xcode project
        run: |
          mkdir -p game/build
          "$GODOT" --headless --path game --export-release "iOS" "$PWD/game/build/empire.ipa" 2>&1 | tail -40 || true
          echo "--- содержимое build ---"
          find game/build -maxdepth 2 | head -40

      - name: Set Cyrillic display name in Info.plist
        run: |
          PLIST=$(find game/build -name "*Info.plist" -not -path "*xcframework*" | head -1)
          echo "Info.plist: $PLIST"
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Империя 1894" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Империя 1894" "$PLIST"
          fi

      - name: Build unsigned .app with xcodebuild
        run: |
          XCPROJ=$(find game/build -name "*.xcodeproj" -maxdepth 2 | head -1)
          echo "Xcode project: $XCPROJ"
          test -n "$XCPROJ"
          SCHEME=$(xcodebuild -project "$XCPROJ" -list | awk '/Schemes:/{getline; gsub(/^ +/,""); print; exit}')
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/appbuild" \
            build
          ls appbuild

      - name: Package IPA
        run: |
          APP=$(find appbuild -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RomanovEmpire-unsigned.ipa Payload
          ls -la RomanovEmpire-unsigned.ipa

      - name: Generate LiveContainer source.json
        run: |
          SIZE=$(stat -f%z RomanovEmpire-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%d)
          VERSION="0.4.${{ github.run_number }}"
          cat > source.json <<EOF
          {
            "name": "Империя 1894",
            "identifier": "com.romanov.source",
            "subtitle": "Романовы. Открытый мир",
            "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Resources/icon.png",
            "apps": [
              {
                "name": "Империя 1894",
                "bundleIdentifier": "com.romanov.empire1894",
                "developerName": "Romanov Project",
                "subtitle": "Движок Godot 4 — лаборатория персонажей",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "versionDescription": "Godot 4: скелетный Николай II, PBR-студия.",
                "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/RomanovEmpire-unsigned.ipa",
                "localizedDescription": "Игра о России конца XIX века на движке Godot 4. Лаборатория персонажей: скелетная модель Николая II из Blender/MakeHuman.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Resources/icon.png",
                "tintColor": "1D4E3B",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "size": $SIZE,
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/RomanovEmpire-unsigned.ipa",
                    "localizedDescription": "Сборка на движке Godot 4."
                  }
                ]
              }
            ]
          }
          EOF
          cat source.json

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Империя 1894 — последняя сборка (Godot 4)"
          body: |
            Сборка на движке Godot 4. Установка через LiveContainer:
            источник `https://github.com/${{ github.repository }}/releases/download/latest/source.json`
            или скачайте IPA ниже.
          files: |
            RomanovEmpire-unsigned.ipa
            source.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomanovEmpire-IPA
          path: RomanovEmpire-unsigned.ipa
          retention-days: 30
