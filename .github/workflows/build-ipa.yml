name: Build IPA

on:
  push:
    branches:
      - main
      - claude/romanov-game-dev-uurxhs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA (for LiveContainer)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, arm64)
        run: |
          xcodebuild \
            -project RomanovEmpire.xcodeproj \
            -target RomanovEmpire \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/RomanovEmpire.app Payload/
          zip -qry RomanovEmpire-unsigned.ipa Payload
          ls -la RomanovEmpire-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomanovEmpire-IPA
          path: RomanovEmpire-unsigned.ipa
          retention-days: 30
