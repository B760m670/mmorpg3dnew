name: Build IPA

on:
  push:
    branches:
      - main
      - claude/romanov-game-dev-uurxhs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (for LiveContainer)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, arm64)
        run: |
          xcodebuild \
            -project RomanovEmpire.xcodeproj \
            -target RomanovEmpire \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/RomanovEmpire.app Payload/
          zip -qry RomanovEmpire-unsigned.ipa Payload
          ls -la RomanovEmpire-unsigned.ipa

      - name: Generate LiveContainer source.json
        run: |
          SIZE=$(stat -f%z RomanovEmpire-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%d)
          VERSION="0.3.${{ github.run_number }}"
          cat > source.json <<EOF
          {
            "name": "Империя 1894",
            "identifier": "com.romanov.source",
            "subtitle": "Романовы. Открытый мир",
            "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Resources/icon.png",
            "apps": [
              {
                "name": "Империя 1894",
                "bundleIdentifier": "com.romanov.empire1894",
                "developerName": "Romanov Project",
                "subtitle": "Лаборатория персонажей",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "versionDescription": "Автоматическая сборка из GitHub Actions.",
                "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/RomanovEmpire-unsigned.ipa",
                "localizedDescription": "Игра о России конца XIX века. Лаборатория персонажей: анатомическая модель Николая II из Blender/MakeHuman, тело и мундир, студийный осмотр.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/Resources/icon.png",
                "tintColor": "1D4E3B",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "size": $SIZE,
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/RomanovEmpire-unsigned.ipa",
                    "localizedDescription": "Автоматическая сборка из GitHub Actions."
                  }
                ]
              }
            ]
          }
          EOF
          cat source.json

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Империя 1894 — последняя сборка"
          body: |
            Автоматическая сборка. Установка через LiveContainer:
            источник `https://github.com/${{ github.repository }}/releases/download/latest/source.json`
            или скачайте IPA ниже.
          files: |
            RomanovEmpire-unsigned.ipa
            source.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomanovEmpire-IPA
          path: RomanovEmpire-unsigned.ipa
          retention-days: 30
