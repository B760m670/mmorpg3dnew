name: RomanovEmpire
options:
  bundleIdPrefix: com.romanov
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  RomanovEmpire:
    type: application
    platform: iOS
    sources:
      - Sources
      # Model files are added individually to Copy Bundle Resources so they
      # land flat at the bundle root (looked up without a subdirectory).
      - path: Resources/Models/nicholas_uniform.obj
        buildPhase: resources
      - path: Resources/Models/nicholas_uniform.mtl
        buildPhase: resources
      - path: Resources/Models/nicholas_body.obj
        buildPhase: resources
      - path: Resources/Models/nicholas_body.mtl
        buildPhase: resources
      - path: Resources/Models/nicholas_skin.png
        buildPhase: resources
      - path: Resources/Models/nicholas_eyes.png
        buildPhase: resources
      - path: Resources/Models/joints.json
        buildPhase: resources
      - path: Resources/icon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanov.empire1894
        PRODUCT_NAME: RomanovEmpire
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Империя 1894"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  RomanovEmpire:
    build:
      targets:
        RomanovEmpire: all
